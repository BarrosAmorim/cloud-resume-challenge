AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: >
  Infraestrutura do Cloud Resume Challenge
  utilizando AWS SAM.

Resources:
  CloudResumeVisitorCount:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: CloudResumeVisitorCountSAM
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      Tags:
        - Key: Project
          Value: CloudResumeChallenge

  CloudResumeCounter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloud-resume-counter-sam
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      CodeUri: backend/
      Timeout: 3

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CloudResumeVisitorCount

      Events:
        CountApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudResumeApi
            Path: /count
            Method: GET

  CloudResumeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: CloudResumeAPI-SAM
      StageName: $default

      CorsConfiguration:
        AllowOrigins:
          - https://barrosamorimd.work

        AllowMethods:
          - GET
